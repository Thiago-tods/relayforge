name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Disposable PostgreSQL for integration tests. These credentials are
    # test-only values for a container that exists for the duration of the job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relayforge_ci
          POSTGRES_PASSWORD: relayforge_ci_password
          POSTGRES_DB: relayforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayforge_ci -d relayforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create and drop their own uniquely named databases here.
      RELAYFORGE_TEST_DATABASE_URL: postgres://relayforge_ci:relayforge_ci_password@127.0.0.1:5432/relayforge_ci?sslmode=disable
      # Target of the migrate command smoke test.
      RELAYFORGE_DATABASE_URL: postgres://relayforge_ci:relayforge_ci_password@127.0.0.1:5432/relayforge_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (unit and PostgreSQL integration, with race detector)
        run: go test -race -count=1 ./...
      - name: Apply migrations
        run: go run ./cmd/migrate up
      - name: Re-apply migrations (must be a no-op)
        run: go run ./cmd/migrate up
      - name: Migration status
        run: go run ./cmd/migrate status
      - name: Verify modules
        run: go mod verify
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet
